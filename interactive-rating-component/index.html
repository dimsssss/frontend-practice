<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./global.css">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./index.css">
  <link rel="stylesheet" href="./thankyou.css">
</head>
<body>
  <div id="card" class="card">
    <header><div class="circle"><img src="./images/icon-star.svg"></div></header>
    <main class="container">
      <h1>How did we do?</h1>
      <p>Please let us know how we did with your support request. All feedback is appreciated 
  to help us improve our offering!</p>
    </main>
    <ul id="scores" class="scores">
        <li class="circle" data-selected="false">1</li>
        <li class="circle" data-selected="false">2</li>
        <li class="circle" data-selected="false">3</li>
        <li class="circle" data-selected="false">4</li>
        <li class="circle" data-selected="false">5</li>
      </ul>
    <footer class="submitButton"><button id="submit" class="button" type="button">Submit</button></footer>
  </div>
</body>
<script src="./active.js"></script>
</html>
