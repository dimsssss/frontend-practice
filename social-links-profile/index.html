<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./global.css">
  <link rel="stylesheet" href="./index.css">
  
  <title>Social links profile</title>

</head>
<body>
  <div id="app">
    <div class="profile">
      <div class="image">
        <a href="#"><img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" /></a>
      </div>
      <div class="content">
        <h1 class="name">Jessica Randall</h1>
        <p class="address">London, United Kingdom</p>
        <p class="introduce">"Front-end developer and avid reader."</p>
      </div>
    </div>
    <ul class="sns-list">
      <li class="sns-button"><a>GitHub</a></li>
      <li class="sns-button"><a>Frontend Mentor</a></li>
      <li class="sns-button"><a>LinkedIn</a></li>
      <li class="sns-button"><a>Twitter</a></li>
      <li class="sns-button"><a>Instagram</a></li>
    </ul>
  </div>
</body>
</html>
